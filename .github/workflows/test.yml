name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs the `unit` and `server` projects only. Both are infrastructure-free:
      # the `database` project is the sole suite that needs Postgres, and it runs
      # in the integration job below where one is actually started.
      - name: Unit and server tests with coverage thresholds
        run: pnpm test:coverage
        env:
          # Three server-project suites import env.ts at module load (monitoring,
          # CSP-report, rate-limit). They need the full env to initialise even
          # though they test no HIBP behaviour. Copied verbatim from the
          # integration and e2e jobs so the four sets cannot drift apart.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ATLAS_KEK: Y2ktcGxhY2Vob2xkZXIta2VrLTMyLWJ5dGVzLW9rISE=
          ATLAS_KEK_VERSION: "1"
          AUDIT_HMAC_KEY: Y2ktcGxhY2Vob2xkZXItaG1hYy0zMi1ieXRlcy1vayE=
          ANTHROPIC_API_KEY: ci-placeholder
          RATE_LIMIT_REDIS_URL: http://127.0.0.1:6379
          RATE_LIMIT_REDIS_TOKEN: ci-placeholder
          HIBP_API_KEY: ci-hibp-placeholder
          ATLAS_ENV: preview

  integration:
    name: Integration tests (RLS, services, jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # ACTIVE since ATL-015, which added the first migration (`profiles`).
    #
    # This job was previously gated to workflow_dispatch because with no schema
    # it would have executed zero assertions and reported green — a false pass on
    # the single most security-critical suite in the project (threat T1, ATL-088).
    # That condition no longer holds: `tests/integration/profiles-rls.test.ts`
    # exercises the two-user RLS matrix security §7 requires.
    #
    # The guard step below is deliberately KEPT. It is no longer about activation
    # but about regression: if the migrations directory were ever emptied, this
    # job must fail loudly rather than pass with nothing to test.
    steps:
      - uses: actions/checkout@v5

      - name: Refuse to report a false pass
        run: |
          set -euo pipefail
          migrations=$(find supabase/migrations -name '*.sql' 2>/dev/null | wc -l)
          if [ "$migrations" -eq 0 ]; then
            echo "::error title=No migrations found::supabase/migrations is empty."
            echo "The first migration landed in ATL-015. An empty directory now means it was removed,"
            echo "which would make this job execute zero assertions and falsely report success."
            exit 1
          fi
          echo "Found $migrations migration(s); proceeding."

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Start local Supabase
        run: pnpm db:start

      - name: Export local Supabase credentials
        run: ./.github/scripts/export-supabase-env.sh

      - name: Database integration tests
        run: pnpm test:integration
        env:
          # Supabase URL and keys come from GITHUB_ENV above. The rest are
          # non-secret local fixtures the app needs to boot; they unlock nothing
          # and reach no hosted service.
          #
          # Required because three integration suites import `@/server/*`, which
          # loads `@/config/env` and validates the WHOLE environment at module
          # load — not just the variables a given test touches. Without this
          # block the job failed on `AUDIT_HMAC_KEY`, `ANTHROPIC_API_KEY` and the
          # rate-limit pair before executing a single assertion.
          #
          # Placeholders rather than `secrets.*` by policy: `ci-policy.ts` allows
          # only `GITHUB_TOKEN`, and `pnpm ci:verify-policy` fails the build on
          # anything else (security §9 — CI has no access to production secrets).
          # Copied verbatim from the `e2e` job below and the `build` workflow so
          # the four jobs cannot drift apart.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ATLAS_KEK: Y2ktcGxhY2Vob2xkZXIta2VrLTMyLWJ5dGVzLW9rISE=
          ATLAS_KEK_VERSION: "1"
          AUDIT_HMAC_KEY: Y2ktcGxhY2Vob2xkZXItaG1hYy0zMi1ieXRlcy1vayE=
          ANTHROPIC_API_KEY: ci-placeholder
          RATE_LIMIT_REDIS_URL: http://127.0.0.1:6379
          RATE_LIMIT_REDIS_TOKEN: ci-placeholder
          HIBP_API_KEY: ci-hibp-placeholder
          ATLAS_ENV: preview

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # A real local Supabase, not placeholders.
      #
      # The previous configuration pointed the app at 127.0.0.1:54321 with fake
      # keys and started nothing there. Since ATL-012 the middleware verifies
      # every product route against Supabase and fails closed when it cannot
      # reach it, so every `/overview` navigation redirected to `/sign-in` and
      # the shell specs had nothing to assert against. Placeholder credentials
      # stopped being viable the moment routes became protected.
      - name: Start local Supabase
        run: pnpm db:start

      - name: Export local Supabase credentials
        run: ./.github/scripts/export-supabase-env.sh

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright
        run: pnpm test:e2e
        env:
          # Supabase URL and keys come from GITHUB_ENV above. The rest are
          # non-secret local fixtures the app needs to boot; they unlock nothing
          # and reach no hosted service.
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          ATLAS_KEK: Y2ktcGxhY2Vob2xkZXIta2VrLTMyLWJ5dGVzLW9rISE=
          ATLAS_KEK_VERSION: "1"
          AUDIT_HMAC_KEY: Y2ktcGxhY2Vob2xkZXItaG1hYy0zMi1ieXRlcy1vayE=
          ANTHROPIC_API_KEY: ci-placeholder
          RATE_LIMIT_REDIS_URL: http://127.0.0.1:6379
          RATE_LIMIT_REDIS_TOKEN: ci-placeholder
          HIBP_API_KEY: ci-hibp-placeholder
          ATLAS_ENV: preview

      - name: Stop Supabase
        if: always()
        run: pnpm db:stop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
