name: Security

# Secret and dependency scanning (ATL-090). Critical findings block merge.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # First-party scan: Atlas-specific credentials (ATLAS_KEK, AUDIT_HMAC_KEY,
      # Supabase service-role JWTs) and committed .env files. Runs on the working
      # tree and is verifiable locally via `pnpm gates:verify --only secrets`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Atlas secret scan (working tree)
        run: pnpm scan:secrets

      # Defense in depth: gitleaks additionally scans full git HISTORY, catching a
      # credential that was committed and later removed.
      - name: Gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # High and critical advisories block the merge unless covered by a
      # documented, time-boxed exception (.github/dependency-exceptions.json).
      # Expired or stale exceptions also fail — accepted risk cannot become
      # permanent by neglect. Runbook: .github/SECURITY.md
      - name: Dependency audit policy
        run: pnpm deps:verify --report audit-report.json

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report.json
          retention-days: 7

  forbidden-patterns:
    name: Forbidden patterns
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Browser storage and `console.*` are deliberately NOT checked here.
      #
      # They were, by two greps over raw file text, and both produced only false
      # positives: a grep cannot tell a comment from code, or a type reference
      # from a call. Every hit was prose explaining the rule — including the
      # comment in `browser-client.ts` stating the client is "deliberately not
      # localStorage" — plus `MockInstance<typeof console.error>`, a type, and
      # `repo-guards.test.ts` itself, which exists to forbid exactly these.
      #
      # Both rules remain enforced, in two places that parse rather than grep and
      # that already run on every pull request:
      #
      #   * ESLint — `no-console: "error"` repo-wide (relaxed only for
      #     `*.config.*` and `scripts/**`), and `no-restricted-globals` for
      #     `localStorage`/`sessionStorage`. Runs in the `lint` gate.
      #   * `src/test/repo-guards.test.ts` — strips comments before testing, so
      #     it flags real usage and ignores discussion of it. Runs in `test`.
      #
      # Deleting the greps removes the false positives without removing any
      # enforcement. Neither replacement was weakened to accommodate this.
      - name: Check for prohibited code patterns
        run: |
          set -euo pipefail
          fail=0

          # A service-role client must never be constructed outside server-only modules.
          # Kept: no ESLint rule or guard test covers this one, so the grep is the
          # only thing enforcing it.
          if grep -rIn --include='*.tsx' -e 'SERVICE_ROLE' src/ 2>/dev/null; then
            echo "::error::Service-role key referenced from a component file."
            fail=1
          fi

          exit $fail
